<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Dots&family=Noto+Sans+JP:wght@400;500;700&display=swap');

  :root {
    --pk-yellow: #FFD700;
    --pk-red: #CC0000;
    --pk-blue: #3B82F6;
    --pk-dark: #1a1a2e;
    --pk-surface: #16213e;
    --pk-card: #0f3460;
    --pk-accent: #e94560;
    --pk-text: #f0f0f0;
    --pk-muted: #8892b0;
    --pk-green: #4ade80;
    --pk-win: #22c55e;
    --pk-lose: #ef4444;
    --pk-draw: #f59e0b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--pk-dark);
    color: var(--pk-text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  .pokeball-bg {
    position: fixed; top: -200px; right: -200px;
    width: 500px; height: 500px;
    border-radius: 50%;
    border: 60px solid rgba(255,255,255,0.03);
    pointer-events: none; z-index: 0;
  }

  .header {
    background: linear-gradient(135deg, #0f3460 0%, #16213e 50%, #1a1a2e 100%);
    border-bottom: 3px solid var(--pk-yellow);
    padding: 16px 20px;
    display: flex; align-items: center; gap: 12px;
    position: sticky; top: 0; z-index: 100;
  }

  .header-logo {
    font-family: 'Zen Dots', cursive;
    font-size: 18px;
    color: var(--pk-yellow);
    text-shadow: 0 0 20px rgba(255,215,0,0.4);
    line-height: 1.2;
  }

  .header-sub { font-size: 11px; color: var(--pk-muted); }

  .nav {
    display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap;
  }

  .nav-btn {
    padding: 7px 14px;
    border: 1px solid rgba(255,215,0,0.3);
    background: transparent;
    color: var(--pk-muted);
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    font-family: 'Noto Sans JP', sans-serif;
    transition: all 0.2s;
  }

  .nav-btn.active, .nav-btn:hover {
    background: var(--pk-yellow);
    color: var(--pk-dark);
    border-color: var(--pk-yellow);
    font-weight: 700;
  }

  .container { max-width: 900px; margin: 0 auto; padding: 20px 16px; position: relative; z-index: 1; }

  .page { display: none; }
  .page.active { display: block; }

  /* === PLAYERS PAGE === */
  .players-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 12px; margin-bottom: 24px;
  }

  .player-card {
    background: var(--pk-surface);
    border: 2px solid rgba(255,215,0,0.2);
    border-radius: 12px;
    padding: 16px 12px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }

  .player-card:hover { border-color: var(--pk-yellow); transform: translateY(-2px); }
  .player-card.selected { border-color: var(--pk-yellow); background: rgba(255,215,0,0.08); }

  .player-avatar {
    width: 60px; height: 60px;
    border-radius: 50%;
    margin: 0 auto 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    border: 3px solid var(--pk-yellow);
    overflow: hidden;
    background: var(--pk-card);
    cursor: pointer;
    position: relative;
  }

  .player-avatar img {
    width: 100%; height: 100%; object-fit: cover; border-radius: 50%;
  }

  .player-avatar-upload {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.6);
    opacity: 0; transition: opacity 0.2s;
    font-size: 18px;
    border-radius: 50%;
  }

  .player-avatar:hover .player-avatar-upload { opacity: 1; }

  .player-name {
    font-size: 13px; font-weight: 700;
    color: var(--pk-text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .player-stats-mini {
    font-size: 11px; color: var(--pk-muted); margin-top: 4px;
  }

  .add-player-btn {
    background: rgba(255,215,0,0.05);
    border: 2px dashed rgba(255,215,0,0.3);
    border-radius: 12px;
    padding: 20px 12px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    color: var(--pk-muted);
    font-size: 12px;
    display: flex; flex-direction: column;
    align-items: center; gap: 6px;
  }

  .add-player-btn:hover { border-color: var(--pk-yellow); color: var(--pk-yellow); }

  /* === MODAL === */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.8);
    z-index: 1000;
    display: none; align-items: center; justify-content: center;
    padding: 20px;
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--pk-surface);
    border: 2px solid var(--pk-yellow);
    border-radius: 16px;
    padding: 24px;
    width: 100%; max-width: 400px;
    max-height: 90vh; overflow-y: auto;
  }

  .modal h3 {
    font-family: 'Zen Dots', cursive;
    color: var(--pk-yellow);
    font-size: 16px;
    margin-bottom: 20px;
  }

  .form-group { margin-bottom: 16px; }

  .form-label {
    display: block; font-size: 12px;
    color: var(--pk-muted); margin-bottom: 6px; font-weight: 500;
  }

  .form-input {
    width: 100%;
    background: var(--pk-card);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--pk-text);
    font-size: 14px;
    font-family: 'Noto Sans JP', sans-serif;
    transition: border-color 0.2s;
  }

  .form-input:focus { outline: none; border-color: var(--pk-yellow); }

  .form-select {
    width: 100%;
    background: var(--pk-card);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--pk-text);
    font-size: 14px;
    font-family: 'Noto Sans JP', sans-serif;
    cursor: pointer;
  }

  .btn {
    padding: 10px 20px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-size: 14px;
    font-family: 'Noto Sans JP', sans-serif;
    font-weight: 700;
    transition: all 0.2s;
  }

  .btn-primary { background: var(--pk-yellow); color: var(--pk-dark); }
  .btn-primary:hover { background: #ffed50; transform: translateY(-1px); }
  .btn-danger { background: var(--pk-red); color: white; }
  .btn-ghost { background: transparent; color: var(--pk-muted); border: 1px solid rgba(255,255,255,0.1); }
  .btn-ghost:hover { border-color: var(--pk-muted); color: var(--pk-text); }

  .btn-row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

  /* === BATTLE ENTRY === */
  .battle-form {
    background: var(--pk-surface);
    border: 2px solid rgba(255,215,0,0.2);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 24px;
  }

  .battle-form h2 {
    font-family: 'Zen Dots', cursive;
    color: var(--pk-yellow);
    font-size: 15px;
    margin-bottom: 20px;
    display: flex; align-items: center; gap: 8px;
  }

  .battle-players-row {
    display: grid; grid-template-columns: 1fr auto 1fr;
    gap: 12px; align-items: start; margin-bottom: 16px;
  }

  .vs-badge {
    background: var(--pk-accent);
    color: white;
    font-family: 'Zen Dots', cursive;
    font-size: 14px;
    padding: 8px 12px;
    border-radius: 8px;
    text-align: center;
    margin-top: 24px;
  }

  .side-input-group {
    display: flex; flex-direction: column; gap: 6px;
  }

  .side-counter {
    display: flex; align-items: center; gap: 8px;
  }

  .side-btn {
    width: 32px; height: 32px;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.15);
    background: var(--pk-card);
    color: var(--pk-text);
    font-size: 18px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  .side-btn:hover { background: var(--pk-yellow); color: var(--pk-dark); }

  .side-display {
    font-size: 28px; font-weight: 700;
    min-width: 40px; text-align: center;
    font-family: 'Zen Dots', cursive;
    color: var(--pk-yellow);
  }

  .winner-indicator {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px; font-weight: 700;
    margin-top: 4px;
  }

  .winner-indicator.win { background: rgba(34,197,94,0.15); color: var(--pk-win); border: 1px solid var(--pk-win); }
  .winner-indicator.lose { background: rgba(239,68,68,0.15); color: var(--pk-lose); border: 1px solid var(--pk-lose); }
  .winner-indicator.draw { background: rgba(245,158,11,0.15); color: var(--pk-draw); border: 1px solid var(--pk-draw); }

  /* === RECORDS === */
  .record-card {
    background: var(--pk-surface);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
    display: flex; align-items: center; gap: 12px;
  }

  .record-players {
    flex: 1;
    display: flex; align-items: center; gap: 8px;
    flex-wrap: wrap;
  }

  .record-player-name { font-size: 13px; font-weight: 700; }
  .record-score {
    font-family: 'Zen Dots', cursive;
    font-size: 16px; color: var(--pk-yellow);
  }

  .record-date { font-size: 11px; color: var(--pk-muted); margin-left: auto; }

  /* === STATS === */
  .stats-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px; margin-bottom: 20px;
  }

  .stat-card {
    background: var(--pk-surface);
    border: 1px solid rgba(255,215,0,0.15);
    border-radius: 12px;
    padding: 16px;
    text-align: center;
  }

  .stat-value {
    font-family: 'Zen Dots', cursive;
    font-size: 28px;
    color: var(--pk-yellow);
  }

  .stat-label { font-size: 11px; color: var(--pk-muted); margin-top: 4px; }

  .player-stats-card {
    background: var(--pk-surface);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
  }

  .player-stats-header {
    display: flex; align-items: center; gap: 12px; margin-bottom: 14px;
  }

  .player-stats-avatar {
    width: 44px; height: 44px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    border: 2px solid var(--pk-yellow);
    overflow: hidden; background: var(--pk-card);
  }

  .player-stats-avatar img {
    width: 100%; height: 100%; object-fit: cover; border-radius: 50%;
  }

  .player-stats-name { font-size: 15px; font-weight: 700; }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
    gap: 8px;
  }

  .stats-mini-card {
    background: var(--pk-card);
    border-radius: 8px;
    padding: 8px;
    text-align: center;
  }

  .stats-mini-val {
    font-family: 'Zen Dots', cursive;
    font-size: 16px;
  }

  .stats-mini-val.win { color: var(--pk-win); }
  .stats-mini-val.lose { color: var(--pk-lose); }
  .stats-mini-val.draw { color: var(--pk-draw); }
  .stats-mini-val.yellow { color: var(--pk-yellow); }

  .stats-mini-label { font-size: 10px; color: var(--pk-muted); margin-top: 2px; }

  .winrate-bar {
    height: 6px; border-radius: 3px;
    background: rgba(255,255,255,0.1);
    margin-top: 10px; overflow: hidden;
  }

  .winrate-fill {
    height: 100%; border-radius: 3px;
    background: linear-gradient(90deg, var(--pk-win), #86efac);
    transition: width 0.5s ease;
  }

  /* === H2H SECTION === */
  .h2h-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }

  .h2h-table th {
    padding: 8px 12px;
    text-align: center;
    color: var(--pk-muted);
    font-weight: 500;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  .h2h-table td {
    padding: 8px 12px;
    text-align: center;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }

  .h2h-table tr:hover td { background: rgba(255,255,255,0.02); }

  /* === SEASON TABS === */
  .season-tabs {
    display: flex; gap: 8px; margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .season-tab {
    padding: 6px 16px;
    border: 1px solid rgba(255,215,0,0.3);
    border-radius: 20px;
    cursor: pointer;
    font-size: 12px;
    color: var(--pk-muted);
    background: transparent;
    font-family: 'Noto Sans JP', sans-serif;
    transition: all 0.2s;
  }

  .season-tab.active {
    background: var(--pk-yellow);
    color: var(--pk-dark);
    font-weight: 700;
    border-color: var(--pk-yellow);
  }

  /* === BATTLE HISTORY === */
  .section-title {
    font-family: 'Zen Dots', cursive;
    font-size: 13px;
    color: var(--pk-yellow);
    margin-bottom: 14px;
    display: flex; align-items: center; gap: 8px;
  }

  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: rgba(255,215,0,0.2);
  }

  .empty-state {
    text-align: center; padding: 40px 20px;
    color: var(--pk-muted);
  }

  .empty-icon { font-size: 48px; margin-bottom: 12px; }
  .empty-text { font-size: 13px; }

  .badge {
    display: inline-flex; align-items: center;
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 10px; font-weight: 700;
  }

  .badge-win { background: rgba(34,197,94,0.15); color: var(--pk-win); }
  .badge-lose { background: rgba(239,68,68,0.15); color: var(--pk-lose); }
  .badge-draw { background: rgba(245,158,11,0.15); color: var(--pk-draw); }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .sub-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .sub-tab {
    padding: 5px 14px;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    color: var(--pk-muted);
    background: transparent;
    font-family: 'Noto Sans JP', sans-serif;
    transition: all 0.2s;
  }

  .sub-tab.active {
    background: rgba(255,215,0,0.1);
    color: var(--pk-yellow);
    border-color: var(--pk-yellow);
  }

  .deck-img-preview {
    width: 60px; height: 60px;
    border-radius: 8px; object-fit: cover;
    border: 1px solid rgba(255,255,255,0.1);
  }

  .deck-img-label {
    width: 60px; height: 60px;
    border-radius: 8px;
    border: 2px dashed rgba(255,255,255,0.15);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 22px;
    color: var(--pk-muted);
    transition: all 0.2s;
  }

  .deck-img-label:hover { border-color: var(--pk-yellow); color: var(--pk-yellow); }

  .loading-overlay {
    text-align: center; padding: 20px;
    color: var(--pk-muted); font-size: 13px;
  }

  .loading-dot {
    display: inline-block;
    animation: blink 1s infinite;
  }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .alert {
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 16px;
    display: none;
  }

  .alert.success { background: rgba(34,197,94,0.1); border: 1px solid var(--pk-win); color: var(--pk-win); display: block; }
  .alert.error { background: rgba(239,68,68,0.1); border: 1px solid var(--pk-lose); color: var(--pk-lose); display: block; }

  .import-section {
    background: var(--pk-surface);
    border: 2px dashed rgba(255,215,0,0.3);
    border-radius: 12px;
    padding: 24px;
    text-align: center;
    margin-bottom: 20px;
  }

  .import-title { color: var(--pk-yellow); font-size: 14px; font-weight: 700; margin-bottom: 8px; }
  .import-desc { color: var(--pk-muted); font-size: 12px; margin-bottom: 16px; }

  .file-upload-hidden { display: none; }

  .scrollable { max-height: 450px; overflow-y: auto; }
  .scrollable::-webkit-scrollbar { width: 4px; }
  .scrollable::-webkit-scrollbar-track { background: transparent; }
  .scrollable::-webkit-scrollbar-thumb { background: rgba(255,215,0,0.3); border-radius: 2px; }
</style>
</head>
<body>
<div class="pokeball-bg"></div>

<div class="header">
  <div>
    <div class="header-logo">⚡ PokeRecord</div>
    <div class="header-sub">ポケカ対戦記録システム</div>
  </div>
  <nav class="nav">
    <button class="nav-btn active" onclick="showPage('players')">プレイヤー</button>
    <button class="nav-btn" onclick="showPage('battle')">対戦入力</button>
    <button class="nav-btn" onclick="showPage('today')">本日の成績</button>
    <button class="nav-btn" onclick="showPage('stats')">累計成績</button>
    <button class="nav-btn" onclick="showPage('history')">履歴</button>
  </nav>
</div>

<div class="container">

  <!-- PLAYERS PAGE -->
  <div id="page-players" class="page active">
    <div class="section-title" style="margin-bottom:16px">プレイヤー管理</div>
    <div id="players-grid" class="players-grid"></div>
  </div>

  <!-- BATTLE PAGE -->
  <div id="page-battle" class="page">
    <div id="battle-alert" class="alert"></div>
    <div class="battle-form">
      <h2>⚔ 対戦結果を入力</h2>
      <div class="form-group">
        <label class="form-label">対戦日</label>
        <input type="date" id="battle-date" class="form-input" />
      </div>
      <div class="battle-players-row">
        <div>
          <label class="form-label">プレイヤー 1</label>
          <select id="p1-select" class="form-select" onchange="updateWinner()"></select>
          <div style="margin-top:12px">
            <label class="form-label">取得サイド枚数</label>
            <div class="side-counter">
              <button class="side-btn" onclick="changeSide('p1',-1)">−</button>
              <span id="p1-sides" class="side-display">0</span>
              <button class="side-btn" onclick="changeSide('p1',1)">+</button>
            </div>
          </div>
          <div style="margin-top:8px">
            <label class="form-label">使用デッキ写真</label>
            <label class="deck-img-label" for="p1-deck-upload" id="p1-deck-label">📸</label>
            <input type="file" id="p1-deck-upload" class="file-upload-hidden" accept="image/*" onchange="previewDeck('p1',this)">
            <img id="p1-deck-preview" class="deck-img-preview" style="display:none">
          </div>
        </div>
        <div class="vs-badge">VS</div>
        <div>
          <label class="form-label">プレイヤー 2</label>
          <select id="p2-select" class="form-select" onchange="updateWinner()"></select>
          <div style="margin-top:12px">
            <label class="form-label">取得サイド枚数</label>
            <div class="side-counter">
              <button class="side-btn" onclick="changeSide('p2',-1)">−</button>
              <span id="p2-sides" class="side-display">0</span>
              <button class="side-btn" onclick="changeSide('p2',1)">+</button>
            </div>
          </div>
          <div style="margin-top:8px">
            <label class="form-label">使用デッキ写真</label>
            <label class="deck-img-label" for="p2-deck-upload" id="p2-deck-label">📸</label>
            <input type="file" id="p2-deck-upload" class="file-upload-hidden" accept="image/*" onchange="previewDeck('p2',this)">
            <img id="p2-deck-preview" class="deck-img-preview" style="display:none">
          </div>
        </div>
      </div>
      <div id="winner-preview" style="margin:12px 0; font-size:13px; color:var(--pk-muted); text-align:center"></div>
      <div style="text-align:center; margin-top:16px">
        <button class="btn btn-primary" onclick="saveBattle()" style="width:200px">対戦記録を保存 ⚡</button>
      </div>
    </div>
  </div>

  <!-- TODAY PAGE -->
  <div id="page-today" class="page">
    <div class="season-tabs" id="today-date-tabs"></div>
    <div id="today-content"></div>
  </div>

  <!-- STATS PAGE -->
  <div id="page-stats" class="page">
    <div class="season-tabs" id="season-tabs-stats"></div>
    <div class="sub-tabs">
      <button class="sub-tab active" onclick="switchSubTab(this,'overview')">総合成績</button>
      <button class="sub-tab" onclick="switchSubTab(this,'h2h')">対戦成績</button>
    </div>
    <div id="stats-overview" class="tab-content active">
      <div id="stats-content"></div>
    </div>
    <div id="stats-h2h" class="tab-content">
      <div id="h2h-content"></div>
    </div>
  </div>

  <!-- HISTORY PAGE -->
  <div id="page-history" class="page">
    <div class="season-tabs" id="season-tabs-history"></div>
    <div id="history-content" class="scrollable"></div>
  </div>

</div>

<!-- Add Player Modal -->
<div id="modal-player" class="modal-overlay" onclick="closeModalOnBg(event,'modal-player')">
  <div class="modal" onclick="event.stopPropagation()">
    <h3>プレイヤー追加・編集</h3>
    <input type="hidden" id="edit-player-id">
    <div class="form-group">
      <label class="form-label">名前</label>
      <input type="text" id="player-name-input" class="form-input" placeholder="プレイヤー名">
    </div>
    <div class="form-group">
      <label class="form-label">アイコン絵文字</label>
      <input type="text" id="player-emoji-input" class="form-input" placeholder="例: 🔥💧⚡" maxlength="2">
    </div>
    <div class="form-group">
      <label class="form-label">プロフィール写真</label>
      <div style="display:flex;align-items:center;gap:12px">
        <div id="modal-avatar-preview" style="width:50px;height:50px;border-radius:50%;background:var(--pk-card);border:2px solid var(--pk-yellow);display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden">
          <span id="modal-avatar-emoji">⚡</span>
        </div>
        <label class="btn btn-ghost" for="player-photo-input" style="cursor:pointer;font-size:12px">写真を選択</label>
        <input type="file" id="player-photo-input" class="file-upload-hidden" accept="image/*" onchange="previewPlayerPhoto(this)">
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="closeModal('modal-player')">キャンセル</button>
      <button class="btn btn-primary" onclick="savePlayer()">保存</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'pokerecord-v2';

let state = {
  players: [],
  battles: [],
  selectedSeason: 'all',
  selectedTodayDate: null,
};

let p1Sides = 0, p2Sides = 0;
let p1DeckImg = null, p2DeckImg = null;
let editingPlayerId = null;
let playerPhotoData = null;
let currentStatsPage = 'all';
let currentHistoryPage = 'all';

async function loadState() {
  try {
    const r = await window.storage.get(STORAGE_KEY, true);
    if (r && r.value) {
      const data = JSON.parse(r.value);
      state.players = data.players || [];
      state.battles = data.battles || [];
    }
  } catch(e) {
    console.log('No saved data:', e);
  }
}

async function saveState() {
  try {
    await window.storage.set(STORAGE_KEY, JSON.stringify({
      players: state.players,
      battles: state.battles
    }), true);
  } catch(e) { console.error('Save error:', e); }
}

function getSeasons() {
  const years = [...new Set(state.battles.map(b => b.date.substr(0,4)))].sort().reverse();
  return years;
}

function getBattlesForSeason(season) {
  if (season === 'all') return state.battles;
  return state.battles.filter(b => b.date.startsWith(season));
}

function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  event.target.classList.add('active');
  if (name === 'players') renderPlayers();
  if (name === 'battle') renderBattleForm();
  if (name === 'today') renderToday();
  if (name === 'stats') renderStats(currentStatsPage);
  if (name === 'history') renderHistory(currentHistoryPage);
}

function renderPlayers() {
  const grid = document.getElementById('players-grid');
  let html = '';
  state.players.forEach(p => {
    const stats = getPlayerStats(p.id, 'all');
    const avatarHtml = p.photo
      ? `<img src="${p.photo}" alt="${p.name}">`
      : `<span>${p.emoji || '⚡'}</span>`;
    html += `<div class="player-card" onclick="editPlayer('${p.id}')">
      <div class="player-avatar">
        ${avatarHtml}
        <div class="player-avatar-upload">✏️</div>
      </div>
      <div class="player-name">${p.name}</div>
      <div class="player-stats-mini">${stats.wins}勝 ${stats.losses}負 ${stats.draws}分</div>
    </div>`;
  });
  if (state.players.length < 6) {
    html += `<div class="add-player-btn" onclick="openAddPlayer()">
      <span style="font-size:28px">+</span>
      <span>プレイヤー追加</span>
    </div>`;
  }
  grid.innerHTML = html;
}

function getPlayerStats(playerId, season) {
  const battles = getBattlesForSeason(season).filter(b =>
    b.p1id === playerId || b.p2id === playerId
  );
  let wins=0, losses=0, draws=0, sidesGet=0, sidesTaken=0;
  battles.forEach(b => {
    const isP1 = b.p1id === playerId;
    const myS = isP1 ? b.p1sides : b.p2sides;
    const oppS = isP1 ? b.p2sides : b.p1sides;
    sidesGet += myS; sidesTaken += oppS;
    if (b.winner === playerId) wins++;
    else if (b.winner === 'draw') draws++;
    else losses++;
  });
  const total = wins + losses + draws;
  const wr = total > 0 ? Math.round(wins / total * 100) : 0;
  return { wins, losses, draws, sidesGet, sidesTaken, total, wr };
}

function openAddPlayer() {
  editingPlayerId = null;
  playerPhotoData = null;
  document.getElementById('player-name-input').value = '';
  document.getElementById('player-emoji-input').value = '⚡';
  document.getElementById('modal-avatar-emoji').textContent = '⚡';
  document.getElementById('modal-avatar-preview').innerHTML = '<span id="modal-avatar-emoji">⚡</span>';
  document.getElementById('modal-player').classList.add('open');
}

function editPlayer(id) {
  editingPlayerId = id;
  const p = state.players.find(p => p.id === id);
  if (!p) return;
  playerPhotoData = p.photo || null;
  document.getElementById('player-name-input').value = p.name;
  document.getElementById('player-emoji-input').value = p.emoji || '⚡';
  const preview = document.getElementById('modal-avatar-preview');
  if (p.photo) {
    preview.innerHTML = `<img src="${p.photo}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;
  } else {
    preview.innerHTML = `<span id="modal-avatar-emoji">${p.emoji || '⚡'}</span>`;
  }
  document.getElementById('modal-player').classList.add('open');
}

function previewPlayerPhoto(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    playerPhotoData = e.target.result;
    const preview = document.getElementById('modal-avatar-preview');
    preview.innerHTML = `<img src="${playerPhotoData}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;
  };
  reader.readAsDataURL(file);
}

function savePlayer() {
  const name = document.getElementById('player-name-input').value.trim();
  if (!name) { alert('名前を入力してください'); return; }
  const emoji = document.getElementById('player-emoji-input').value || '⚡';
  if (editingPlayerId) {
    const p = state.players.find(p => p.id === editingPlayerId);
    if (p) { p.name = name; p.emoji = emoji; if (playerPhotoData) p.photo = playerPhotoData; }
  } else {
    if (state.players.length >= 6) { alert('最大6人まで'); return; }
    state.players.push({
      id: 'p_' + Date.now(),
      name, emoji,
      photo: playerPhotoData || null
    });
  }
  saveState();
  closeModal('modal-player');
  renderPlayers();
  renderBattleForm();
}

function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}

function closeModalOnBg(e, id) {
  if (e.target.id === id) closeModal(id);
}

function renderBattleForm() {
  const selects = ['p1-select', 'p2-select'];
  selects.forEach(sid => {
    const sel = document.getElementById(sid);
    sel.innerHTML = '<option value="">-- 選択 --</option>' +
      state.players.map(p => `<option value="${p.id}">${p.emoji||'⚡'} ${p.name}</option>`).join('');
  });
  const today = new Date().toISOString().substr(0,10);
  document.getElementById('battle-date').value = today;
  p1Sides = 0; p2Sides = 0;
  document.getElementById('p1-sides').textContent = '0';
  document.getElementById('p2-sides').textContent = '0';
  updateWinner();
}

function changeSide(p, delta) {
  if (p === 'p1') {
    p1Sides = Math.max(0, Math.min(6, p1Sides + delta));
    document.getElementById('p1-sides').textContent = p1Sides;
  } else {
    p2Sides = Math.max(0, Math.min(6, p2Sides + delta));
    document.getElementById('p2-sides').textContent = p2Sides;
  }
  updateWinner();
}

function updateWinner() {
  const p1id = document.getElementById('p1-select').value;
  const p2id = document.getElementById('p2-select').value;
  const preview = document.getElementById('winner-preview');
  if (!p1id || !p2id) { preview.textContent = ''; return; }
  if (p1id === p2id) { preview.textContent = '⚠️ 同じプレイヤーは選べません'; return; }
  const p1 = state.players.find(p=>p.id===p1id);
  const p2 = state.players.find(p=>p.id===p2id);
  let msg = '';
  if (p1Sides === 6 && p2Sides < 6) msg = `🏆 ${p1.name} の勝利！`;
  else if (p2Sides === 6 && p1Sides < 6) msg = `🏆 ${p2.name} の勝利！`;
  else if (p1Sides > p2Sides) msg = `🏆 ${p1.name} が有利`;
  else if (p2Sides > p1Sides) msg = `🏆 ${p2.name} が有利`;
  else if (p1Sides === 0 && p2Sides === 0) msg = '対戦成績を入力してください';
  else msg = '🤝 引き分け';
  preview.textContent = msg;
}

function previewDeck(p, input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const data = e.target.result;
    if (p==='p1') { p1DeckImg = data; }
    else { p2DeckImg = data; }
    const label = document.getElementById(`${p}-deck-label`);
    const prev = document.getElementById(`${p}-deck-preview`);
    label.style.display = 'none';
    prev.src = data; prev.style.display = 'block';
  };
  reader.readAsDataURL(file);
}

function determineWinner(p1id, p2id, s1, s2) {
  if (s1 === 6 && s2 < 6) return p1id;
  if (s2 === 6 && s1 < 6) return p2id;
  if (s1 > s2) return p1id;
  if (s2 > s1) return p2id;
  return 'draw';
}

async function saveBattle() {
  const p1id = document.getElementById('p1-select').value;
  const p2id = document.getElementById('p2-select').value;
  const date = document.getElementById('battle-date').value;
  const alert = document.getElementById('battle-alert');

  if (!p1id || !p2id) { showAlert('プレイヤーを選択してください','error'); return; }
  if (p1id === p2id) { showAlert('同じプレイヤーは選択できません','error'); return; }
  if (!date) { showAlert('日付を入力してください','error'); return; }

  const winner = determineWinner(p1id, p2id, p1Sides, p2Sides);
  const battle = {
    id: 'b_' + Date.now(),
    date, p1id, p2id,
    p1sides: p1Sides, p2sides: p2Sides,
    winner,
    p1deck: p1DeckImg,
    p2deck: p2DeckImg
  };
  state.battles.push(battle);
  await saveState();
  showAlert('対戦記録を保存しました！⚡','success');
  p1Sides = 0; p2Sides = 0;
  p1DeckImg = null; p2DeckImg = null;
  document.getElementById('p1-sides').textContent = '0';
  document.getElementById('p2-sides').textContent = '0';
  document.getElementById('p1-deck-label').style.display = 'flex';
  document.getElementById('p1-deck-preview').style.display = 'none';
  document.getElementById('p2-deck-label').style.display = 'flex';
  document.getElementById('p2-deck-preview').style.display = 'none';
  document.getElementById('p1-select').value = '';
  document.getElementById('p2-select').value = '';
  updateWinner();
}

function showAlert(msg, type) {
  const a = document.getElementById('battle-alert');
  a.textContent = msg;
  a.className = 'alert ' + type;
  setTimeout(() => { a.className = 'alert'; }, 3000);
}

function renderToday() {
  const dates = [...new Set(state.battles.map(b=>b.date))].sort().reverse();
  const tabsEl = document.getElementById('today-date-tabs');
  if (dates.length === 0) {
    tabsEl.innerHTML = '';
    document.getElementById('today-content').innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-text">まだ対戦記録がありません</div></div>';
    return;
  }
  const today = new Date().toISOString().substr(0,10);
  const activeDate = state.selectedTodayDate || (dates.includes(today) ? today : dates[0]);
  state.selectedTodayDate = activeDate;

  tabsEl.innerHTML = dates.slice(0,5).map(d =>
    `<button class="season-tab ${d===activeDate?'active':''}" onclick="selectTodayDate('${d}')">${d}</button>`
  ).join('');

  renderTodayContent(activeDate);
}

function selectTodayDate(date) {
  state.selectedTodayDate = date;
  renderToday();
}

function renderTodayContent(date) {
  const battles = state.battles.filter(b=>b.date===date);
  const playerIds = [...new Set(battles.flatMap(b=>[b.p1id,b.p2id]))];
  let html = '';

  html += `<div class="section-title">対戦成績 (${date})</div>`;
  html += '<div class="stats-grid">';
  playerIds.forEach(pid => {
    const p = state.players.find(x=>x.id===pid);
    if (!p) return;
    const myBattles = battles.filter(b=>b.p1id===pid||b.p2id===pid);
    let w=0,l=0,d=0,sg=0,st=0;
    myBattles.forEach(b=>{
      const isP1=b.p1id===pid;
      sg += isP1?b.p1sides:b.p2sides;
      st += isP1?b.p2sides:b.p1sides;
      if(b.winner===pid)w++;
      else if(b.winner==='draw')d++;
      else l++;
    });
    const total=w+l+d;
    const wr=total>0?Math.round(w/total*100):0;
    const avatarHtml = p.photo
      ? `<img src="${p.photo}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`
      : `<span>${p.emoji||'⚡'}</span>`;
    html += `<div class="player-stats-card">
      <div class="player-stats-header">
        <div class="player-stats-avatar">${avatarHtml}</div>
        <div><div class="player-stats-name">${p.name}</div>
        <div style="font-size:11px;color:var(--pk-muted)">${total}試合 / 勝率${wr}%</div></div>
      </div>
      <div class="stats-row">
        <div class="stats-mini-card"><div class="stats-mini-val win">${w}</div><div class="stats-mini-label">勝</div></div>
        <div class="stats-mini-card"><div class="stats-mini-val lose">${l}</div><div class="stats-mini-label">負</div></div>
        <div class="stats-mini-card"><div class="stats-mini-val draw">${d}</div><div class="stats-mini-label">分</div></div>
        <div class="stats-mini-card"><div class="stats-mini-val yellow">${sg}</div><div class="stats-mini-label">取得S</div></div>
        <div class="stats-mini-card"><div class="stats-mini-val" style="color:var(--pk-muted)">${st}</div><div class="stats-mini-label">被取S</div></div>
      </div>
      <div class="winrate-bar"><div class="winrate-fill" style="width:${wr}%"></div></div>
    </div>`;
  });
  html += '</div>';

  html += `<div class="section-title" style="margin-top:16px">対戦結果一覧</div>`;
  if (battles.length === 0) {
    html += '<div class="empty-state"><div class="empty-text">この日の記録なし</div></div>';
  } else {
    battles.slice().reverse().forEach(b => html += renderBattleRow(b));
  }

  document.getElementById('today-content').innerHTML = html;
}

function renderBattleRow(b) {
  const p1 = state.players.find(x=>x.id===b.p1id);
  const p2 = state.players.find(x=>x.id===b.p2id);
  if (!p1 || !p2) return '';
  const getResult = (pid) => {
    if (b.winner===pid) return '<span class="badge badge-win">勝</span>';
    if (b.winner==='draw') return '<span class="badge badge-draw">分</span>';
    return '<span class="badge badge-lose">負</span>';
  };
  const p1Avatar = p1.photo ? `<img src="${p1.photo}" style="width:28px;height:28px;border-radius:50%;object-fit:cover">` : `<span>${p1.emoji||'⚡'}</span>`;
  const p2Avatar = p2.photo ? `<img src="${p2.photo}" style="width:28px;height:28px;border-radius:50%;object-fit:cover">` : `<span>${p2.emoji||'⚡'}</span>`;
  return `<div class="record-card">
    <div class="record-players">
      <div style="display:flex;align-items:center;gap:6px">${p1Avatar}
        <div>
          <div class="record-player-name">${p1.name} ${getResult(b.p1id)}</div>
          <div style="font-size:11px;color:var(--pk-muted)">サイド ${b.p1sides}枚</div>
        </div>
      </div>
      <div class="record-score">${b.p1sides} - ${b.p2sides}</div>
      <div style="display:flex;align-items:center;gap:6px">${p2Avatar}
        <div>
          <div class="record-player-name">${p2.name} ${getResult(b.p2id)}</div>
          <div style="font-size:11px;color:var(--pk-muted)">サイド ${b.p2sides}枚</div>
        </div>
      </div>
    </div>
    <div class="record-date">${b.date}</div>
  </div>`;
}

function renderStats(season) {
  currentStatsPage = season;
  const seasons = getSeasons();
  const tabsEl = document.getElementById('season-tabs-stats');
  tabsEl.innerHTML = `<button class="season-tab ${season==='all'?'active':''}" onclick="renderStats('all')">全期間</button>` +
    seasons.map(y=>`<button class="season-tab ${season===y?'active':''}" onclick="renderStats('${y}')">${y}年</button>`).join('');

  renderStatsOverview(season);
  renderH2H(season);
}

function renderStatsOverview(season) {
  const battles = getBattlesForSeason(season);
  let html = '';
  html += `<div class="stats-grid" style="margin-bottom:8px">
    <div class="stat-card"><div class="stat-value">${battles.length}</div><div class="stat-label">総対戦数</div></div>
    <div class="stat-card"><div class="stat-value">${state.players.length}</div><div class="stat-label">プレイヤー数</div></div>
    <div class="stat-card"><div class="stat-value">${[...new Set(battles.map(b=>b.date))].length}</div><div class="stat-label">対戦日数</div></div>
  </div>`;

  html += '<div class="section-title" style="margin-top:16px">プレイヤー別成績</div>';
  const sorted = [...state.players].map(p => ({...p, stats: getPlayerStats(p.id, season)}))
    .sort((a,b) => b.stats.wr - a.stats.wr || b.stats.wins - a.stats.wins);

  sorted.forEach(p => {
    const s = p.stats;
    if (s.total === 0) return;
    const avatarHtml = p.photo
      ? `<img src="${p.photo}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`
      : `<span>${p.emoji||'⚡'}</span>`;
    html += `<div class="player-stats-card">
      <div class="player-stats-header">
        <div class="player-stats-avatar">${avatarHtml}</div>
        <div>
          <div class="player-stats-name">${p.name}</div>
          <div style="font-size:11px;color:var(--pk-muted)">${s.total}試合 / 勝率${s.wr}%</div>
        </div>
      </div>
      <div class="stats-row">
        <div class="stats-mini-card"><div class="stats-mini-val win">${s.wins}</div><div class="stats-mini-label">勝</div></div>
        <div class="stats-mini-card"><div class="stats-mini-val lose">${s.losses}</div><div class="stats-mini-label">負</div></div>
        <div class="stats-mini-card"><div class="stats-mini-val draw">${s.draws}</div><div class="stats-mini-label">分</div></div>
        <div class="stats-mini-card"><div class="stats-mini-val yellow">${s.sidesGet}</div><div class="stats-mini-label">取得S</div></div>
        <div class="stats-mini-card"><div class="stats-mini-val" style="color:var(--pk-muted)">${s.sidesTaken}</div><div class="stats-mini-label">被取S</div></div>
        <div class="stats-mini-card"><div class="stats-mini-val yellow">${s.wr}%</div><div class="stats-mini-label">勝率</div></div>
      </div>
      <div class="winrate-bar"><div class="winrate-fill" style="width:${s.wr}%"></div></div>
    </div>`;
  });

  document.getElementById('stats-content').innerHTML = html;
}

function renderH2H(season) {
  const battles = getBattlesForSeason(season);
  const players = state.players;
  if (players.length < 2) {
    document.getElementById('h2h-content').innerHTML = '<div class="empty-state"><div class="empty-text">プレイヤーが2人以上必要です</div></div>';
    return;
  }

  let html = '';
  for (let i = 0; i < players.length; i++) {
    for (let j = i+1; j < players.length; j++) {
      const p1 = players[i], p2 = players[j];
      const h2hBattles = battles.filter(b =>
        (b.p1id===p1.id&&b.p2id===p2.id) || (b.p1id===p2.id&&b.p2id===p1.id)
      );
      if (h2hBattles.length === 0) continue;
      let p1w=0, p2w=0, draws=0;
      h2hBattles.forEach(b => {
        if(b.winner===p1.id)p1w++;
        else if(b.winner===p2.id)p2w++;
        else draws++;
      });
      const p1av = p1.photo?`<img src="${p1.photo}" style="width:22px;height:22px;border-radius:50%;object-fit:cover">`:`<span>${p1.emoji||'⚡'}</span>`;
      const p2av = p2.photo?`<img src="${p2.photo}" style="width:22px;height:22px;border-radius:50%;object-fit:cover">`:`<span>${p2.emoji||'⚡'}</span>`;
      html += `<div class="record-card" style="flex-direction:column;align-items:stretch">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
          <div style="display:flex;align-items:center;gap:6px">${p1av}<span style="font-size:13px;font-weight:700">${p1.name}</span></div>
          <div style="font-family:'Zen Dots',cursive;font-size:18px;color:var(--pk-yellow)">${p1w} - ${p2w}</div>
          <div style="display:flex;align-items:center;gap:6px"><span style="font-size:13px;font-weight:700">${p2.name}</span>${p2av}</div>
        </div>
        <div style="font-size:11px;color:var(--pk-muted);text-align:center">${h2hBattles.length}試合 / 引き分け${draws}回</div>
      </div>`;
    }
  }

  if (!html) html = '<div class="empty-state"><div class="empty-text">対戦データがありません</div></div>';
  document.getElementById('h2h-content').innerHTML = html;
}

function renderHistory(season) {
  currentHistoryPage = season;
  const seasons = getSeasons();
  const tabsEl = document.getElementById('season-tabs-history');
  tabsEl.innerHTML = `<button class="season-tab ${season==='all'?'active':''}" onclick="renderHistory('all')">全期間</button>` +
    seasons.map(y=>`<button class="season-tab ${season===y?'active':''}" onclick="renderHistory('${y}')">${y}年</button>`).join('');

  const battles = getBattlesForSeason(season).slice().reverse();
  let html = '';
  if (battles.length === 0) {
    html = '<div class="empty-state"><div class="empty-icon">⚔</div><div class="empty-text">対戦記録がありません</div></div>';
  } else {
    battles.forEach(b => { html += renderBattleRow(b); });
  }
  document.getElementById('history-content').innerHTML = html;
}

function switchSubTab(btn, tab) {
  document.querySelectorAll('.sub-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
  document.getElementById('stats-' + tab).classList.add('active');
}

async function init() {
  await loadState();

  if (state.players.length === 0) {
    const samplePlayers = [
      { id:'p_1', name:'サトシ', emoji:'⚡', photo:null },
      { id:'p_2', name:'コジロウ', emoji:'🌙', photo:null },
    ];
    state.players = samplePlayers;
    const today = new Date().toISOString().substr(0,10);
    const yesterday = new Date(Date.now()-86400000).toISOString().substr(0,10);
    state.battles = [
      { id:'b_1', date:today, p1id:'p_1', p2id:'p_2', p1sides:6, p2sides:3, winner:'p_1', p1deck:null, p2deck:null },
      { id:'b_2', date:today, p1id:'p_2', p2id:'p_1', p1sides:6, p2sides:2, winner:'p_2', p1deck:null, p2deck:null },
      { id:'b_3', date:yesterday, p1id:'p_1', p2id:'p_2', p1sides:6, p2sides:0, winner:'p_1', p1deck:null, p2deck:null },
    ];
    await saveState();
  }

  renderPlayers();
}

init();
</script>
